<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">cs2metal</title>
  <desc id="desc">cs2metal: the native Linux build of Counter-Strike 2, on Apple silicon Macs. A layer diagram: the unmodified Linux ELF build on top, the cs2metal host in the middle, macOS with Metal at the bottom.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="0.55" stop-color="#11151e"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c9d1dc"/>
      <stop offset="0.55" stop-color="#8e99a8"/>
      <stop offset="1" stop-color="#dfe5ec"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6a2b"/>
    </linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a32"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="88" y="270" font-size="124" font-weight="800" letter-spacing="-4" fill="url(#metal)">cs2metal</text>
    <rect x="92" y="300" width="132" height="6" rx="3" fill="url(#accent)"/>
    <text x="90" y="366" font-size="32" font-weight="600" fill="#e8ecf2">The native Linux build of Counter-Strike 2,</text>
    <text x="90" y="408" font-size="32" font-weight="600" fill="#e8ecf2">on Apple silicon Macs.</text>
    <text x="90" y="466" font-size="22" fill="#9aa5b4">No Wine · no virtual machine · no modified game file</text>

    <g transform="translate(760 150)">
      <rect width="440" height="96" rx="14" fill="#171c26" stroke="#2c3442"/>
      <text x="24" y="42" font-size="22" font-weight="700" fill="#e8ecf2">Linux build, unmodified</text>
      <text x="24" y="72" font-size="17" fill="#8b96a6" font-family="ui-monospace, 'SF Mono', Menlo, monospace">ELF x86-64 · glibc 2.31 · Vulkan</text>

      <path d="M220 104v18" stroke="#3a4352" stroke-width="2"/>

      <rect y="130" width="440" height="96" rx="14" fill="url(#host)"/>
      <text x="24" y="172" font-size="22" font-weight="800" fill="#1a1006">cs2metal host</text>
      <text x="24" y="202" font-size="17" fill="#3a2410" font-family="ui-monospace, 'SF Mono', Menlo, monospace">loader · system calls · bridges</text>

      <path d="M220 234v18" stroke="#3a4352" stroke-width="2"/>

      <rect y="260" width="440" height="96" rx="14" fill="#171c26" stroke="#2c3442"/>
      <text x="24" y="302" font-size="22" font-weight="700" fill="#e8ecf2">macOS · Rosetta 2</text>
      <text x="24" y="332" font-size="17" fill="#8b96a6" font-family="ui-monospace, 'SF Mono', Menlo, monospace">SDL 3 · MoltenVK on Metal · Steam</text>
    </g>

    <text x="90" y="584" font-size="16" fill="#5f6a7a">Not affiliated with or endorsed by Valve or Apple.</text>
  </g>
</svg>
